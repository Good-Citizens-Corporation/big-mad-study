name: Sonar Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # SONAR_HOST_URL is optional on SonarCloud; required for self-hosted
      # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test:ci

      # Skips rather than fails when the token is absent. An unauthenticated
      # scan exits 403, which made this check permanently red on every PR —
      # which trains everyone to ignore a security gate.
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@v2

      - name: Note skipped scan
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not set — SonarCloud scan skipped."
